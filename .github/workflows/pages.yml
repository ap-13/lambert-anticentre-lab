name: Build and deploy notebook pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - uses: actions/configure-pages@v6
      - run: uv sync --locked
      - run: uv run python scripts/prepare_lambert_data.py --download
      - run: uv run pytest -m "requires_lambert_release"
      - run: >-
          uv run jupyter nbconvert --to html --execute
          --ExecutePreprocessor.timeout=180
          --output-dir _site
          notebooks/01_from_sky_to_galactic_phase_space.ipynb
          notebooks/02_reading_the_disturbed_anticentre.ipynb
          notebooks/03_from_spiral_winding_to_a_galactic_clock.ipynb
          notebooks/04_visual_intuition_lab.ipynb
      - run: >-
          uv run python -c "from pathlib import Path;
          notebooks = [('01_from_sky_to_galactic_phase_space.html', '01 — From sky to Galactic phase space'),
          ('02_reading_the_disturbed_anticentre.html', '02 — Reading the disturbed anticentre'),
          ('04_visual_intuition_lab.html', '04 — Visual intuition lab'),
          ('03_from_spiral_winding_to_a_galactic_clock.html', '03 — From spiral winding to a Galactic clock')];
          links = ''.join(f'<li><a href=\"{filename}\">{title}</a></li>' for filename, title in notebooks);
          Path('_site/index.html').write_text(f'<!doctype html><html lang=\"en\"><head><meta charset=\"utf-8\"><title>Lambert Anticentre Lab</title></head><body><h1>Lambert Anticentre Lab</h1><p>Recommended reading order:</p><ol>{links}</ol></body></html>', encoding='utf-8')"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
